<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OrbitPay | Admin Messages</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <a
        href="admin-dashboard.html"
        class="logo">

        OrbitPay Admin

    </a>


    <div
        style="
            margin-left:auto;
            display:flex;
            gap:10px;
        "
    >

        <a
            href="admin-dashboard.html"
            class="btn primary-btn">

            Dashboard

        </a>


        <button
            onclick="logout()"
            class="btn primary-btn">

            Logout

        </button>

    </div>

</header>



<!-- =====================================================
     MAIN CONTENT
===================================================== -->

<section class="features">


    <h1 class="section-title">

        Contact Messages

    </h1>



    <!-- =================================================
         SEARCH & FILTER
    ================================================== -->

    <div
        class="card"
        style="
            margin-bottom:30px;
        "
    >

        <h2>

            Search & Filter

        </h2>


        <br>


        <!-- SEARCH -->

        <label for="search-input">

            Search Messages

        </label>


        <br><br>


        <input
            type="text"
            id="search-input"
            placeholder="Search name, email, subject or message..."
            style="
                width:100%;
                padding:14px;
                border:1px solid #ccc;
                border-radius:8px;
                box-sizing:border-box;
            "
        >


        <br><br>



        <!-- FILTERS -->

        <div
            style="
                display:grid;
                grid-template-columns:
                    repeat(
                        auto-fit,
                        minmax(200px, 1fr)
                    );
                gap:20px;
            "
        >


            <!-- DEPARTMENT FILTER -->

            <div>

                <label for="department-filter">

                    Department

                </label>


                <br><br>


                <select
                    id="department-filter"
                    style="
                        width:100%;
                        padding:14px;
                        border:1px solid #ccc;
                        border-radius:8px;
                        box-sizing:border-box;
                    "
                >

                    <option value="all">

                        All Departments

                    </option>

                </select>

            </div>



            <!-- STATUS FILTER -->

            <div>

                <label for="status-filter">

                    Message Status

                </label>


                <br><br>


                <select
                    id="status-filter"
                    style="
                        width:100%;
                        padding:14px;
                        border:1px solid #ccc;
                        border-radius:8px;
                        box-sizing:border-box;
                    "
                >

                    <option value="all">

                        All Messages

                    </option>


                    <option value="unread">

                        Unread

                    </option>


                    <option value="read">

                        Read

                    </option>

                </select>

            </div>

        </div>


        <br>


        <!-- CLEAR FILTERS -->

        <button
            type="button"
            onclick="clearFilters()"
            class="btn primary-btn">

            Clear Filters

        </button>

    </div>



    <!-- =================================================
         MESSAGE COUNT
    ================================================== -->

    <p id="message-count">

        Loading messages...

    </p>



    <!-- =================================================
         LOADING MESSAGE
    ================================================== -->

    <p id="loading">

        Loading...

    </p>



    <!-- =================================================
         MESSAGES TABLE
    ================================================== -->

    <div
        style="
            overflow-x:auto;
        "
    >

        <table
            id="messages-table"
            style="
                width:100%;
                border-collapse:collapse;
                display:none;
            "
        >

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Name</th>

                    <th>Email</th>

                    <th>Subject</th>

                    <th>Department</th>

                    <th>Message</th>

                    <th>Date</th>

                    <th>Status</th>

                    <th>Action</th>

                </tr>

            </thead>


            <tbody id="messages-body">

            </tbody>

        </table>

    </div>

</section>



<!-- =====================================================
     MESSAGE VIEW MODAL
====================================================== -->

<div
    id="message-modal"
    style="
        display:none;
        position:fixed;
        top:0;
        left:0;
        width:100%;
        height:100%;
        background:rgba(0,0,0,0.6);
        z-index:9999;
        align-items:center;
        justify-content:center;
        padding:20px;
        box-sizing:border-box;
    "
>


    <div
        class="card"
        style="
            width:100%;
            max-width:650px;
            max-height:80vh;
            overflow-y:auto;
            background:white;
            padding:30px;
            border-radius:12px;
            box-sizing:border-box;
        "
    >


        <!-- MODAL HEADER -->

        <div
            style="
                display:flex;
                justify-content:space-between;
                align-items:center;
                gap:20px;
                margin-bottom:20px;
            "
        >

            <h2>

                Message Details

            </h2>


            <button
                type="button"
                onclick="closeMessageModal()"
                class="btn primary-btn"
            >

                ✕ Close

            </button>

        </div>



        <!-- NAME -->

        <p>

            <strong>Name:</strong>

            <span id="modal-name"></span>

        </p>



        <!-- EMAIL -->

        <p>

            <strong>Email:</strong>

            <span id="modal-email"></span>

        </p>



        <!-- SUBJECT -->

        <p>

            <strong>Subject:</strong>

            <span id="modal-subject"></span>

        </p>



        <!-- DEPARTMENT -->

        <p>

            <strong>Department:</strong>

            <span id="modal-department"></span>

        </p>



        <!-- DATE -->

        <p>

            <strong>Date:</strong>

            <span id="modal-date"></span>

        </p>



        <!-- STATUS -->

        <p>

            <strong>Status:</strong>

            <span id="modal-status"></span>

        </p>



        <hr>



        <h3>

            Message

        </h3>



        <div
            id="modal-message"
            style="
                background:#f5f5f5;
                padding:15px;
                border-radius:8px;
                white-space:pre-wrap;
                line-height:1.6;
                word-break:break-word;
            "
        ></div>


    </div>

</div>



<!-- =====================================================
     JAVASCRIPT
====================================================== -->

<script>


// =====================================================
// GET ADMIN TOKEN
// =====================================================

const token =
    localStorage.getItem(
        "orbitpay_admin_token"
    );



// =====================================================
// CHECK LOGIN
// =====================================================

if (!token) {

    window.location.href =
        "admin-login.html";

}



// =====================================================
// GET HTML ELEMENTS
// =====================================================

const searchInput =
    document.getElementById(
        "search-input"
    );


const departmentFilter =
    document.getElementById(
        "department-filter"
    );


const statusFilter =
    document.getElementById(
        "status-filter"
    );


const messagesBody =
    document.getElementById(
        "messages-body"
    );


const messagesTable =
    document.getElementById(
        "messages-table"
    );


const loading =
    document.getElementById(
        "loading"
    );


const messageCount =
    document.getElementById(
        "message-count"
    );



// =====================================================
// STORE ALL MESSAGES
// =====================================================

let allMessages = [];



// =====================================================
// LOAD MESSAGES
// =====================================================

async function loadMessages() {

    try {


        const response =
            await fetch(
                "http://localhost:3005/api/contact-messages",
                {
                    method: "GET",

                    headers: {
                        "Authorization":
                            `Bearer ${token}`
                    }
                }
            );



        const result =
            await response.json();



        console.log(
            "MESSAGES:",
            result
        );



        // =================================================
        // TOKEN INVALID
        // =================================================

        if (response.status === 401) {

            localStorage.removeItem(
                "orbitpay_admin_token"
            );

            window.location.href =
                "admin-login.html";

            return;

        }



        // =================================================
        // OTHER SERVER ERROR
        // =================================================

        if (!response.ok) {

            loading.textContent =
                result.message ||
                "Unable to load messages.";

            return;

        }



        // =================================================
        // SAVE MESSAGES
        // =================================================

        allMessages =
            result.data || [];



        loading.style.display =
            "none";



        // =================================================
        // CREATE DEPARTMENT FILTER
        // =================================================

        createDepartmentOptions();



        // =================================================
        // DISPLAY MESSAGES
        // =================================================

        displayMessages();


    } catch (error) {


        console.error(
            "LOAD MESSAGES ERROR:",
            error
        );


        loading.textContent =
            "Unable to connect to the server.";

    }

}



// =====================================================
// CREATE DEPARTMENT OPTIONS
// =====================================================

function createDepartmentOptions() {


    const departments = [
        ...new Set(
            allMessages
                .map(
                    message =>
                        message.department
                )
                .filter(Boolean)
        )
    ];



    departments.sort();



    departmentFilter.innerHTML = `

        <option value="all">

            All Departments

        </option>

    `;



    departments.forEach(
        department => {


            const option =
                document.createElement(
                    "option"
                );


            option.value =
                department;


            option.textContent =
                department;


            departmentFilter.appendChild(
                option
            );

        }
    );

}



// =====================================================
// DISPLAY / FILTER MESSAGES
// =====================================================

function displayMessages() {


    const search =
        searchInput.value
            .trim()
            .toLowerCase();



    const department =
        departmentFilter.value;



    const status =
        statusFilter.value;



    // =================================================
    // FILTER MESSAGES
    // =================================================

    const filteredMessages =
        allMessages.filter(
            message => {


                const searchableText = `

                    ${message.name || ""}

                    ${message.email || ""}

                    ${message.subject || ""}

                    ${message.message || ""}

                    ${message.department || ""}

                `.toLowerCase();



                const matchesSearch =
                    searchableText.includes(
                        search
                    );



                const matchesDepartment =
                    department === "all" ||
                    message.department ===
                        department;



                const matchesStatus =

                    status === "all"

                    ||

                    (
                        status === "read" &&
                        message.isRead === true
                    )

                    ||

                    (
                        status === "unread" &&
                        message.isRead === false
                    );



                return (
                    matchesSearch &&
                    matchesDepartment &&
                    matchesStatus
                );

            }
        );



    // =================================================
    // MESSAGE COUNT
    // =================================================

    messageCount.textContent =
        `Showing ${filteredMessages.length} of ${allMessages.length} messages`;



    // =================================================
    // CLEAR TABLE
    // =================================================

    messagesBody.innerHTML = "";



    // =================================================
    // NO RESULTS
    // =================================================

    if (
        filteredMessages.length === 0
    ) {


        messagesBody.innerHTML = `

            <tr>

                <td
                    colspan="9"
                    style="
                        text-align:center;
                        padding:30px;
                    "
                >

                    No messages match your search or filters.

                </td>

            </tr>

        `;


        messagesTable.style.display =
            "table";


        return;

    }



    // =================================================
    // CREATE TABLE ROWS
    // =================================================

    filteredMessages.forEach(
        message => {


            const row =
                document.createElement(
                    "tr"
                );



            row.innerHTML = `

                <td>

                    ${escapeHTML(
                        String(
                            message.id
                        )
                    )}

                </td>


                <td>

                    ${escapeHTML(
                        message.name
                    )}

                </td>


                <td>

                    ${escapeHTML(
                        message.email
                    )}

                </td>


                <td>

                    ${escapeHTML(
                        message.subject
                    )}

                </td>


                <td>

                    ${escapeHTML(
                        message.department
                    )}

                </td>


                <td>

                    ${escapeHTML(
                        message.message
                    )}

                </td>


                <td>

                    ${formatDate(
                        message.createdAt
                    )}

                </td>


                <td>

                    ${
                        message.isRead

                        ?

                        `
                        <span
                            style="
                                color:green;
                                font-weight:bold;
                            "
                        >

                            ✓ Read

                        </span>
                        `

                        :

                        `
                        <span
                            style="
                                color:#d89b00;
                                font-weight:bold;
                            "
                        >

                            ● Unread

                        </span>
                        `
                    }

                </td>


                <td>

                    <div
                        style="
                            display:flex;
                            flex-wrap:wrap;
                            gap:8px;
                        "
                    >


                        <!-- VIEW -->

                        <button
                            type="button"
                            onclick="viewMessage(${message.id})"
                            class="btn primary-btn"
                        >

                            View

                        </button>



                        <!-- READ / UNREAD -->

                        ${
                            message.isRead

                            ?

                            `
                            <button
                                type="button"
                                onclick="markAsUnread(${message.id})"
                                class="btn primary-btn"
                            >

                                Mark as Unread

                            </button>
                            `

                            :

                            `
                            <button
                                type="button"
                                onclick="markAsRead(${message.id})"
                                class="btn primary-btn"
                            >

                                Mark as Read

                            </button>
                            `
                        }



                        <!-- DELETE -->

                        <button
                            type="button"
                            onclick="deleteMessage(${message.id})"
                            class="btn primary-btn"
                        >

                            Delete

                        </button>


                    </div>

                </td>

            `;



            messagesBody.appendChild(
                row
            );

        }
    );



    messagesTable.style.display =
        "table";

}



// =====================================================
// VIEW MESSAGE
// =====================================================

function viewMessage(id) {


    const message =
        allMessages.find(
            item =>
                item.id === id
        );



    if (!message) {

        alert(
            "Message not found."
        );

        return;

    }



    // =================================================
    // PUT MESSAGE INTO MODAL
    // =================================================

    document.getElementById(
        "modal-name"
    ).textContent =
        message.name || "";



    document.getElementById(
        "modal-email"
    ).textContent =
        message.email || "";



    document.getElementById(
        "modal-subject"
    ).textContent =
        message.subject || "";



    document.getElementById(
        "modal-department"
    ).textContent =
        message.department || "";



    document.getElementById(
        "modal-date"
    ).textContent =
        formatDate(
            message.createdAt
        );



    document.getElementById(
        "modal-status"
    ).textContent =
        message.isRead
            ? "Read"
            : "Unread";



    document.getElementById(
        "modal-message"
    ).textContent =
        message.message || "";



    // =================================================
    // SHOW MODAL
    // =================================================

    document.getElementById(
        "message-modal"
    ).style.display =
        "flex";

}



// =====================================================
// CLOSE MESSAGE MODAL
// =====================================================

function closeMessageModal() {


    document.getElementById(
        "message-modal"
    ).style.display =
        "none";

}



// =====================================================
// CLOSE MODAL WHEN CLICKING OUTSIDE
// =====================================================

document.getElementById(
    "message-modal"
).addEventListener(
    "click",
    function(event) {


        if (
            event.target === this
        ) {

            closeMessageModal();

        }

    }
);



// =====================================================
// MARK MESSAGE AS READ
// =====================================================

async function markAsRead(id) {


    try {


        const response =
            await fetch(
                `http://localhost:3005/api/contact-messages/${id}/read`,
                {
                    method: "PUT",

                    headers: {
                        "Authorization":
                            `Bearer ${token}`
                    }
                }
            );



        const result =
            await response.json();



        if (
            response.status === 401
        ) {

            localStorage.removeItem(
                "orbitpay_admin_token"
            );

            window.location.href =
                "admin-login.html";

            return;

        }



        if (!response.ok) {

            alert(
                result.message ||
                "Unable to mark message as read."
            );

            return;

        }



        // =================================================
        // UPDATE LOCAL MESSAGE
        // =================================================

        const message =
            allMessages.find(
                item =>
                    item.id === id
            );



        if (message) {

            message.isRead =
                true;

        }



        displayMessages();


    } catch (error) {


        console.error(
            "MARK AS READ ERROR:",
            error
        );


        alert(
            "Unable to connect to the server."
        );

    }

}



// =====================================================
// MARK MESSAGE AS UNREAD
// =====================================================

async function markAsUnread(id) {


    try {


        const response =
            await fetch(
                `http://localhost:3005/api/contact-messages/${id}/unread`,
                {
                    method: "PUT",

                    headers: {
                        "Authorization":
                            `Bearer ${token}`
                    }
                }
            );



        const result =
            await response.json();



        if (
            response.status === 401
        ) {

            localStorage.removeItem(
                "orbitpay_admin_token"
            );

            window.location.href =
                "admin-login.html";

            return;

        }



        if (!response.ok) {

            alert(
                result.message ||
                "Unable to mark message as unread."
            );

            return;

        }



        // =================================================
        // UPDATE LOCAL MESSAGE
        // =================================================

        const message =
            allMessages.find(
                item =>
                    item.id === id
            );



        if (message) {

            message.isRead =
                false;

        }



        displayMessages();


    } catch (error) {


        console.error(
            "MARK AS UNREAD ERROR:",
            error
        );


        alert(
            "Unable to connect to the server."
        );

    }

}



// =====================================================
// DELETE MESSAGE
// =====================================================

async function deleteMessage(id) {


    const confirmed =
        confirm(
            "Are you sure you want to delete this message?"
        );



    if (!confirmed) {

        return;

    }



    try {


        const response =
            await fetch(
                `http://localhost:3005/api/contact-messages/${id}`,
                {
                    method: "DELETE",

                    headers: {
                        "Authorization":
                            `Bearer ${token}`
                    }
                }
            );



        const result =
            await response.json();



        if (
            response.status === 401
        ) {

            localStorage.removeItem(
                "orbitpay_admin_token"
            );

            window.location.href =
                "admin-login.html";

            return;

        }



        if (!response.ok) {

            alert(
                result.message ||
                "Unable to delete message."
            );

            return;

        }



        // =================================================
        // REMOVE FROM LOCAL ARRAY
        // =================================================

        allMessages =
            allMessages.filter(
                message =>
                    message.id !== id
            );



        // =================================================
        // REFRESH DEPARTMENTS
        // =================================================

        createDepartmentOptions();



        // =================================================
        // REFRESH TABLE
        // =================================================

        displayMessages();



        alert(
            "Message deleted successfully."
        );


    } catch (error) {


        console.error(
            "DELETE MESSAGE ERROR:",
            error
        );


        alert(
            "Unable to connect to the server."
        );

    }

}



// =====================================================
// SEARCH EVENT
// =====================================================

searchInput.addEventListener(
    "input",
    displayMessages
);



// =====================================================
// DEPARTMENT FILTER EVENT
// =====================================================

departmentFilter.addEventListener(
    "change",
    displayMessages
);



// =====================================================
// STATUS FILTER EVENT
// =====================================================

statusFilter.addEventListener(
    "change",
    displayMessages
);



// =====================================================
// CLEAR FILTERS
// =====================================================

function clearFilters() {


    searchInput.value =
        "";


    departmentFilter.value =
        "all";


    statusFilter.value =
        "all";


    displayMessages();

}



// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHTML(value) {


    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        value ?? "";


    return div.innerHTML;

}



// =====================================================
// FORMAT DATE
// =====================================================

function formatDate(date) {


    if (!date) {

        return "N/A";

    }



    const parsedDate =
        new Date(date);



    if (
        Number.isNaN(
            parsedDate.getTime()
        )
    ) {

        return "Invalid date";

    }



    return parsedDate.toLocaleString();

}



// =====================================================
// LOGOUT
// =====================================================

function logout() {


    localStorage.removeItem(
        "orbitpay_admin_token"
    );


    window.location.href =
        "admin-login.html";

}



// =====================================================
// START APPLICATION
// =====================================================

loadMessages();


</script>


</body>

</html>
